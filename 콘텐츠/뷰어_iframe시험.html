<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>iframe 시험</title>
<style>
body{background:#141414;color:#eee;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;
  padding:20px;margin:0}
h1{font-size:18px;margin:0 0 10px}
.st{font-size:13px;margin:0 0 14px;line-height:1.6}
.ok{color:#60FE47} .no{color:#ff6b6b}
iframe{width:900px;height:560px;border:2px solid #444;background:#fff}
</style></head><body>
<h1>https://kimjungyoun.com/ 을 iframe 으로 띄워 봅니다</h1>
<div class="st" id="st">확인 중…</div>
<iframe id="f" src="https://kimjungyoun.com/"></iframe>
<script>
const f = document.getElementById("f"), st = document.getElementById("st");
let loaded = false;
f.addEventListener("load", () => { loaded = true; });
setTimeout(() => {
  let inner = null, err = "";
  try { inner = f.contentDocument && f.contentDocument.body
    ? f.contentDocument.body.innerHTML.length : null; }
  catch (e) { err = String(e.name); }
  // 교차출처 iframe 이 '정상 로드' 되면 contentDocument 는 조용히 null 이 된다.
  // 그걸 차단으로 읽었던 것이 처음 판정이 틀린 이유다.
  // 헤더(X-Frame-Options)로도 단정할 수 없다 — 이 사이트는 SAMEORIGIN 인데도 표시된다.
  // 그래서 판정하지 않고, 아래 프레임에 그림이 뜨는지 눈으로 보게 둔다.
  st.innerHTML = loaded
    ? `load 발생 · contentDocument ${inner === null ? "null(교차출처면 정상)" : inner + "글자"}` +
      `${err ? " · " + err : ""}<br><b class="ok">아래 프레임에 그림이 뜨면 됩니다.</b> ` +
      `흰 칸만 남으면 차단입니다. 처음 몇 초는 흰 칸일 수 있으니 기다려 보십시오.`
    : `<b class="no">load 이벤트가 나지 않았습니다</b> — 차단일 가능성이 큽니다`;
  window.__r = { loaded, inner, err };
}, 6000);
</script></body></html>
