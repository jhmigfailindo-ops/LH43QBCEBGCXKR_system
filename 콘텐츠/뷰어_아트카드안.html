<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>아트 카드 — 두 안</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;color:#eee;padding:22px 16px 70px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:#999;margin-bottom:20px;line-height:1.65}
.row{display:flex;gap:20px;align-items:flex-start}
.col{width:470px;flex:0 0 auto}
.cap{font-size:14px;font-weight:800;margin-bottom:3px}
.dev{font-size:10.5px;font-weight:800;color:#6f6f6f;letter-spacing:1px;margin-bottom:4px}
.why{font-size:11.5px;color:#9a9a9a;line-height:1.6;margin-bottom:8px;min-height:96px}
.frame{zoom:.46}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

.card{width:1008px;height:1803px;background:#000;color:#000;
  display:flex;flex-direction:column;overflow:hidden}
.top{height:146px;padding:0 34px;border-bottom:22px solid #000;background:#FFF;
  display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.top .press{font-size:60px;font-weight:900;letter-spacing:-2px}
.top .pmeta{font-size:27px;font-weight:700}
/* 남는 자리를 그대로 채웁니다 — 칸 크기를 코드에 적지 않습니다 */
.bodyw{flex:1;background:#FFF;min-height:0;position:relative;overflow:hidden}
.bodyw iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.foot{height:74px;margin:22px 0 0;background:#000;color:#EDEDED;display:flex;align-items:center;
  padding:0 24px;font-size:25px;font-weight:900;flex:0 0 auto;letter-spacing:1px}
</style></head><body>
<h1>아트 카드 — 표지 페이지, 두 안</h1>
<div class="sub">둘 다 <b>속보 하단바는 남깁니다.</b> 다른 점은 맨 위 타이틀뿐입니다.<br>
띄우는 페이지는 <b class="mono">/</b> (표지) 입니다. 표지는 100vh 배치일 수 있어 <b>칸 높이에 따라 모습이 달라집니다</b> — 두 안을 나란히 두는 이유입니다.</div>
<div class="row" id="row"></div>
<div style="margin-top:22px;font-size:12px;color:#8a8a8a" id="msr"></div>
<script>
const SRC = "https://kimjungyoun.com/";      // 표지 페이지
const SPECS = [
  { id:"one", cap:"1안 — 타이틀 있음", dev:"타이틀 + 표지 iframe + 속보 하단바",
    why:"다른 카드와 같은 머리글을 씌웁니다. <b>지금 어느 카드인지</b> 알 수 있고 열두 장이 한 벌로 보입니다. 대신 표지의 로고와 우리 타이틀이 위아래로 겹쳐 <b>이름이 두 번</b> 나옵니다.",
    top:true },
  { id:"two", cap:"2안 — 타이틀 없음", dev:"표지 iframe + 속보 하단바",
    why:"맨 위 <b>ART · KIMJUNGYOUN</b> 을 없애고 표지가 위부터 시작합니다. 표지가 자기 로고를 이미 갖고 있어 <b>이름 중복이 사라지고</b>, 칸이 146px 더 높아 표지 배치가 덜 눌립니다. 하단바는 남아 속보가 흐릅니다.",
    top:false },
];
document.getElementById("row").innerHTML = SPECS.map(s => `
  <div class="col">
    <div class="cap">${s.cap}</div>
    <div class="dev mono">${s.dev}</div>
    <div class="why">${s.why}</div>
    <div class="frame"><div class="card" id="c_${s.id}">
      ${s.top ? `<div class="top"><div class="press">ART</div>
        <div class="pmeta mono">[ KIMJUNGYOUN ]</div></div>` : ""}
      <div class="bodyw"><iframe src="${SRC}" scrolling="no" loading="lazy"></iframe></div>
      <div class="foot">속보가 그대로 흐릅니다</div>
    </div></div>
  </div>`).join("");
setTimeout(() => {
  const m = SPECS.map(s => {
    const b = document.querySelector(`#c_${s.id} .bodyw`);
    return `${s.cap} → iframe 칸 ${b.clientWidth} × ${b.clientHeight}`;
  });
  document.getElementById("msr").innerHTML = "실제 iframe 칸 크기 — " + m.join(" &nbsp;·&nbsp; ");
}, 1500);
</script></body></html>
