<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>달력 — 표제 모눈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;color:#eee;padding:22px 18px 70px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:#999;margin-bottom:18px;line-height:1.65}
.detail{background:#0d0d0d;border:1px solid #2e2e2e;padding:16px 18px 18px;margin-bottom:24px}
.dttl{font-size:13px;font-weight:800;color:#ddd;margin-bottom:12px}
.dlbl{font-size:10.5px;font-weight:800;color:#8a8a8a;margin:0 0 6px;letter-spacing:1px}
/* 카드 조각을 떼어 볼 때는 흰 바탕을 먼저 준다 — 두 번 틀렸던 지점 */
.dwrap{color:#000;background:#FFF;margin-bottom:14px}
.row{display:flex;gap:18px;align-items:flex-start}
.col{width:404px;flex:0 0 auto}
.cap{font-size:13.5px;font-weight:800;margin-bottom:3px}
.dev{font-size:10.5px;font-weight:800;color:#6f6f6f;letter-spacing:1px;margin-bottom:4px}
.why{font-size:11.5px;color:#9a9a9a;line-height:1.6;margin-bottom:8px;min-height:96px}
.frame{zoom:.40}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

/* ══ 지금 배포된 값 그대로 ══ */
.card{width:1008px;height:1803px;background:#000;color:#000;
  display:flex;flex-direction:column;overflow:hidden}
.top{height:146px;padding:0 34px;border-bottom:22px solid #000;background:#FFF;
  display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.top .press{font-size:60px;font-weight:900;letter-spacing:-2px}
.top .pmeta{font-size:27px;font-weight:700}
.cl{flex:1;display:flex;flex-direction:column;background:#FFF;min-height:0}
.clmh{height:150px;flex:0 0 auto;position:relative;overflow:hidden;
  border-bottom:8px solid #000;background:#FFF}
.clplate{position:absolute;left:26px;top:22px;background:#FFF;border:5px solid #000;
  padding:6px 22px 10px}
.clplate b{font-size:76px;font-weight:900;letter-spacing:-4px;line-height:1;display:block}
.clyr{position:absolute;right:0;bottom:0;background:#000;color:#FFF;padding:9px 22px;
  font-size:23px;font-weight:900;letter-spacing:2px}
.cldow{height:78px;flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);
  background:#000;color:#FFF}
.cldow div{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.cldow .we{color:#9a9a9a}
.clgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);min-height:0}
.clcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  border-bottom:5px solid #000;border-right:5px solid #000}
.clcell:nth-child(7n){border-right:none}
.clcell.off,.clcell.next{border-right:none}
.clcell.off.keep{border-right:5px solid #000}
.clcell .n{font-size:52px;font-weight:900;letter-spacing:-2px}
.clcell .hd{width:15px;height:15px;background:#000;border-radius:50%}
.clcell.we{background:#F2F2F2}
.clcell.we .n{color:#8f8f8f}
.clcell.we .hd{background:#8f8f8f}
.clcell.past .n{color:#C4C4C4}
.clcell.past .hd{background:#C4C4C4}
.clcell.today{background:#000}
.clcell.today .n{color:#FFF}
.clcell.today .hd{background:#FFF}
.clcell.next{background:transparent}
.clcell.next .n{color:#DCDCDC}
.clcell.next .hd{background:#DCDCDC}
.clhol{height:118px;flex:0 0 auto;border-top:8px solid #000;display:flex;align-items:center;
  justify-content:center;gap:36px;padding:0 30px;overflow:hidden}
.clhol span{font-size:29px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.clhol span em{font-style:normal;font-weight:700;color:#777;margin-right:9px}
.clhol span.nx{color:#C9C9C9}
.clhol span.nx em{color:#DCDCDC}
.foot{height:74px;margin:22px 0 0;background:#000;color:#EDEDED;display:flex;align-items:center;
  padding:0 24px;font-size:25px;font-weight:900;flex:0 0 auto;letter-spacing:1px}

/* ② 예전 값 그대로 되돌림 — 24px · #BDBDBD 2px */
.M24 .clmh{background-image:linear-gradient(#BDBDBD 2px,transparent 2px),
                            linear-gradient(90deg,#BDBDBD 2px,transparent 2px);
  background-size:24px 24px}
/* ③ 연하고 크게 — 격자와 밀도가 겹치지 않게 */
.M36 .clmh{background-image:linear-gradient(#DCDCDC 2px,transparent 2px),
                            linear-gradient(90deg,#DCDCDC 2px,transparent 2px);
  background-size:36px 36px}
</style></head><body>
<h1>달력 — 월 영역에 격자를 넣으면</h1>
<div class="sub">지금 배포된 스펙(세로선 있음 · 바깥 칸 세로선 없음 · 뒤쪽 다음 달 날짜) 그대로에 <b>표제 모눈만</b> 되돌립니다.<br>
격자에 세로선이 생긴 뒤라 인상이 달라졌을 수 있어 <b>연하고 큰 모눈</b>도 붙였습니다. 오늘은 8월 24일.</div>

<div class="detail">
  <div class="dttl">표제만 실제 크기 (1008 × 150)</div>
  <div class="dlbl">① 지금 — 모눈 없음</div>
  <div class="dwrap" id="d0"></div>
  <div class="dlbl">② 모눈 24px · #BDBDBD (예전 값)</div>
  <div class="dwrap M24" id="d1"></div>
  <div class="dlbl">③ 모눈 36px · #DCDCDC (연하고 크게)</div>
  <div class="dwrap M36" id="d2"></div>
</div>

<div class="row" id="row"></div>
<script>
const HOL = { "2026-08-15":"광복절", "2026-08-17":"대체공휴일(광복절)" };
const TODAY = "2026-08-24", DOW = ["일","월","화","수","목","금","토"];
const pad = n => String(n).padStart(2,"0");

function cells(y, m) {
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const out = [];
  for (let i = 0; i < first; i++) out.push({ off: true, keep: i === first - 1 });
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m+1)}-${pad(d)}`, dow = (first + d - 1) % 7;
    out.push({ d, key, hol: HOL[key] || "", we: dow===0||dow===6||!!HOL[key],
               today: key===TODAY, past: key<TODAY });
  }
  let nd = 1;
  while (out.length % 7) {
    const nx = new Date(y, m + 1, nd);
    const key = `${nx.getFullYear()}-${pad(nx.getMonth()+1)}-${pad(nx.getDate())}`;
    out.push({ d: nd, key, hol: HOL[key] || "", next: true }); nd++;
  }
  return out;
}
const MH = `<div class="clmh"><div class="clplate"><b>8월</b></div>
  <div class="clyr mono">2026</div></div>`;

function card(cls) {
  const list = cells(2026, 7);
  const marks = list.filter(c => c.hol);
  return `
    <div class="card ${cls}">
      <div class="top"><div class="press">CALENDAR</div>
        <div class="pmeta mono">[ 2026. 8 ]</div></div>
      <div class="cl">
        ${MH}
        <div class="cldow">${DOW.map((x,i)=>
          `<div class="${i===0||i===6?"we":""}">${x}</div>`).join("")}</div>
        <div class="clgrid">${list.map(c => {
          if (c.off) return `<div class="clcell off${c.keep?" keep":""}"></div>`;
          const k = ["clcell", c.we?"we":"", c.past?"past":"",
                     c.today?"today":"", c.next?"next":""].filter(Boolean).join(" ");
          return `<div class="${k}"><div class="n">${c.d}</div>${
            c.hol?`<div class="hd"></div>`:""}</div>`;
        }).join("")}</div>
        <div class="clhol">${marks.map(c =>
          `<span class="${c.next?"nx":""}"><em>${+c.key.slice(5,7)}.${
            +c.key.slice(8,10)}</em>${c.hol}</span>`).join("")}</div>
      </div>
      <div class="foot">속보가 그대로 흐릅니다</div>
    </div>`;
}

["d0","d1","d2"].forEach(id => { document.getElementById(id).innerHTML = MH; });

const SPECS = [
  { id:"", cap:"① 지금 (배포된 것)", dev:"모눈 없음",
    why:"표제가 흰 바탕. 아래 격자만 선을 가집니다." },
  { id:"M24", cap:"② 모눈 24px (예전 값)", dev:"#BDBDBD 2px · 24px",
    why:"예전에 넣었던 값 그대로. 격자에 세로선이 생긴 뒤라 <b>표제 모눈과 달력 격자가 둘 다 격자</b>가 되어, 위아래가 같은 무늬로 이어져 보입니다. 처음 뺐던 이유(밀도 겹침)가 세로선 때문에 더 커졌습니다." },
  { id:"M36", cap:"③ 모눈 36px · 연하게", dev:"#DCDCDC 2px · 36px",
    why:"칸을 키우고 색을 낮춰 달력 격자(144px 칸 · 검정 5px)와 밀도·농도를 벌렸습니다. 종이 질감만 남고 '격자'로는 읽히지 않아, 표제가 아래와 경쟁하지 않습니다." },
];
document.getElementById("row").innerHTML = SPECS.map(s => `
  <div class="col">
    <div class="cap">${s.cap}</div>
    <div class="dev mono">${s.dev}</div>
    <div class="why">${s.why}</div>
    <div class="frame">${card(s.id)}</div>
  </div>`).join("");
</script></body></html>
