<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>달력 — 격자무늬 표제 배치</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;color:#eee;padding:22px 20px 70px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:#999;margin-bottom:18px;line-height:1.65}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.detail{background:#0d0d0d;border:1px solid #2e2e2e;padding:16px 18px 20px;margin-bottom:26px}
.dttl{font-size:13px;font-weight:800;color:#ddd;margin-bottom:14px}
.dlbl{font-size:10.5px;font-weight:800;color:#8a8a8a;margin:0 0 6px;letter-spacing:1px}
.dwrap{color:#000;margin-bottom:18px}
.row{display:flex;gap:20px;align-items:flex-start}
.col{width:404px;flex:0 0 auto}
.cap{font-size:13.5px;font-weight:800;margin-bottom:3px}
.dev{font-size:10.5px;font-weight:800;color:#6f6f6f;letter-spacing:1px;margin-bottom:4px}
.why{font-size:11.5px;color:#9a9a9a;line-height:1.6;margin-bottom:8px;min-height:92px}
.frame{zoom:.40}

.card{width:1008px;height:1803px;background:#000;color:#000;
  display:flex;flex-direction:column;overflow:hidden}
.top{height:146px;padding:0 34px;border-bottom:22px solid #000;background:#FFF;
  display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.top .ttl{font-size:60px;font-weight:900;letter-spacing:-2px}
.top .meta{font-size:27px;font-weight:700}
.body{flex:1;background:#FFF;display:flex;flex-direction:column;min-height:0}
.foot{height:74px;margin:22px 0 0;background:#000;color:#EDEDED;display:flex;align-items:center;
  padding:0 24px;font-size:25px;font-weight:900;flex:0 0 auto;letter-spacing:1px}
.dow{height:78px;display:grid;grid-template-columns:repeat(7,1fr);background:#000;color:#FFF;flex:0 0 auto}
.dow div{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.dow .we{color:#9a9a9a}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);min-height:0}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  border-bottom:5px solid #000}
.cell .n{font-size:52px;font-weight:900;letter-spacing:-2px}
.cell .dot{width:15px;height:15px;background:#000;border-radius:50%}
.cell.we{background:#F2F2F2}
.past .n{color:#C4C4C4}
.we .n{color:#8f8f8f}
.today{background:#000}
.today .n{color:#FFF}
.today .dot{background:#FFF}
.hol{height:118px;border-top:8px solid #000;display:flex;align-items:center;
  justify-content:center;gap:36px;padding:0 30px;flex:0 0 auto}
.hol span{font-size:29px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.hol span em{font-style:normal;font-weight:700;color:#777;margin-right:9px}

/* ══ 모눈 바탕 — 세 안이 함께 씁니다 ══ */
.mh{height:150px;flex:0 0 auto;position:relative;overflow:hidden;
  border-bottom:8px solid #000;background-color:#FFF;
  background-image:linear-gradient(#BDBDBD 2px,transparent 2px),
                   linear-gradient(90deg,#BDBDBD 2px,transparent 2px);
  background-size:24px 24px}
.plate{position:absolute;background:#FFF;border:5px solid #000;padding:6px 22px 10px}
.plate b{font-size:76px;font-weight:900;letter-spacing:-4px;line-height:1;display:block}
.yr{background:#000;color:#FFF;padding:9px 22px;font-size:23px;font-weight:900;letter-spacing:2px}

/* ── A. 킵 : 판은 좌상단, 연도는 우하단 ── */
.A .plate{left:26px;top:22px}
.A .yr{position:absolute;right:0;bottom:0}

/* ── B. 배치 바꿈 : 판은 좌하단(바닥에 앉음), 연도는 우상단 ── */
.B .plate{left:26px;bottom:14px}
.B .yr{position:absolute;right:0;top:0}

/* ── C. 겹침 : 연도 박스가 판의 오른쪽 아래에 반쯤 올라탐 ── */
.C .plate{left:26px;top:20px;z-index:1}
.C .yr{position:absolute;right:-58px;bottom:-23px;z-index:2}
</style></head><body>
<h1>달력 — 격자무늬 표제, 월·연도 배치 세 가지</h1>
<div class="sub">모눈(24px)과 흰 타입 판은 그대로. <b>8월 판과 2026 박스의 자리만</b> 다릅니다.<br>
모눈은 축소하면 사라지므로 아래에 <b>실제 크기(1008 × 150)</b> 로 먼저 놓았습니다.</div>

<div class="detail">
  <div class="dttl">실제 크기 — 1008 × 150 (100%)</div>
  <div class="dlbl">A. 킵 — 판은 좌상단, 연도는 우하단</div>
  <div class="dwrap A" id="dA"></div>
  <div class="dlbl">B. 배치 바꿈 — 판은 좌하단(바닥에 앉음), 연도는 우상단</div>
  <div class="dwrap B" id="dB"></div>
  <div class="dlbl">C. 겹침 — 연도 박스가 판의 오른쪽 아래에 반쯤 올라탐</div>
  <div class="dwrap C" id="dC"></div>
</div>

<div class="row" id="row"></div>
<script>
const HOL = { "2026-08-15":"광복절", "2026-08-17":"대체공휴일" };
const TODAY = "2026-08-20", DOW = ["일","월","화","수","목","금","토"];
function cells() {
  const first = new Date(2026,7,1).getDay(), out = [];
  for (let i=0;i<first;i++) out.push(null);
  for (let d=1;d<=31;d++) {
    const key = `2026-08-${String(d).padStart(2,"0")}`, dow = (first+d-1)%7;
    out.push({ d, key, hol: HOL[key]||"", we: dow===0||dow===6||!!HOL[key],
               today: key===TODAY, past: key<TODAY });
  }
  while (out.length%7) out.push(null);
  return out;
}
const dowRow = () => DOW.map((x,i)=>`<div class="${i===0||i===6?"we":""}">${x}</div>`).join("");
const grid = () => cells().map(c => {
  if (!c) return `<div class="cell"></div>`;
  const k = ["cell", c.we?"we":"", c.past?"past":"", c.today?"today":""].filter(Boolean).join(" ");
  return `<div class="${k}"><div class="n">${c.d}</div>${c.hol?`<div class="dot"></div>`:""}</div>`;
}).join("");
const holBar = () => `<div class="hol">${Object.entries(HOL).map(([k,v])=>
  `<span><em>${+k.slice(5,7)}.${+k.slice(8,10)}</em>${v}</span>`).join("")}</div>`;

/* 겹침은 연도가 판 밖으로 나가므로 판 안에 넣습니다 */
const MH = (id) => id === "C"
  ? `<div class="mh"><div class="plate"><b>8월</b><div class="yr mono">2026</div></div></div>`
  : `<div class="mh"><div class="plate"><b>8월</b></div><div class="yr mono">2026</div></div>`;

["A","B","C"].forEach(id => { document.getElementById("d"+id).innerHTML = MH(id); });

const SPECS = [
  { id:"A", cap:"A. 킵", dev:"좌상단 판 · 우하단 연도",
    why:"판이 위에 떠 있고 연도가 반대편 아래에 앉습니다. 대각으로 균형을 잡는 가장 무난한 배치입니다." },
  { id:"B", cap:"B. 배치 바꿈", dev:"좌하단 판 · 우상단 연도",
    why:"판을 모눈 <b>바닥에 앉히고</b> 연도를 위로 올립니다. 판이 아래 요일 띠에 맞닿아 <b>표제와 표가 한 덩어리</b>로 붙고, 모눈이 위쪽에 넓게 남아 여백이 살아납니다." },
  { id:"C", cap:"C. 겹침", dev:"연도가 판에 반쯤 올라탐",
    why:"검정 연도 박스가 흰 판의 <b>오른쪽 아래 귀퉁이를 반쯤 물고</b> 있습니다. 판의 테두리를 끊어 먹으면서 앞뒤 순서가 생겨, 두 요소가 <b>한 덩어리</b>로 읽힙니다. RAW·New Brutalism 의 겹침 장치입니다." },
];
document.getElementById("row").innerHTML = SPECS.map(s => `
  <div class="col">
    <div class="cap">${s.cap}</div>
    <div class="dev mono">${s.dev}</div>
    <div class="why">${s.why}</div>
    <div class="frame"><div class="card ${s.id}">
      <div class="top"><div class="ttl">CALENDAR</div><div class="meta mono">[ 2026. 8 ]</div></div>
      <div class="body">${MH(s.id)}<div class="dow">${dowRow()}</div>
        <div class="grid">${grid()}</div>${holBar()}</div>
      <div class="foot">속보가 그대로 흐릅니다</div>
    </div></div>
  </div>`).join("");
</script></body></html>
