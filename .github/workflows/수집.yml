# 10분마다 뉴스·날씨·버스를 받아 화면용 파일을 만들고, gh-pages 갈래에 올립니다.
#
# 인증키는 저장소에 두지 않습니다. Settings → Secrets → Actions 의
# DATA_GO_KR_KEY 값을 아래에서 환경변수로 넘겨줍니다.
name: 수집

on:
  schedule:
    # 10분마다. GitHub 사정에 따라 몇 분 늦게 도는 일이 있습니다.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # 손으로 지금 돌리기 (Actions 탭의 Run workflow)

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # GitHub 서버는 UTC 로 돕니다. 그대로 두면 화면의 갱신 시각이
    # 아홉 시간 전으로 찍힙니다(01:16 을 16:16 으로).
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 사진 처리에 쓰는 것 설치
        run: pip install --quiet pillow

      - name: 지난번 사진 가져오기
        # 사진은 파일 이름이 기사 주소의 지문이라, 이미 받아 둔 것은 다시 받지 않습니다.
        # gh-pages 는 콘텐츠 폴더의 '속'을 올린 갈래라 img/ 가 맨 위에 있습니다.
        # (예전에는 콘텐츠/ 를 찾아서 아무것도 못 가져왔습니다)
        # 사진만 가져옵니다 — 통째로 가져오면 옛 signage.html 이 새것을 덮어씁니다.
        # 어느 경우든 이 단계는 실패로 끝나지 않습니다. 못 가져오면 사진을 모두 새로 받을 뿐입니다.
        run: |
          if ! git fetch origin gh-pages --depth=1 2>/dev/null; then
            echo "gh-pages 를 받지 못했습니다(첫 실행이거나 접속 실패) — 사진을 모두 새로 받습니다"
          elif ! git cat-file -e FETCH_HEAD:img 2>/dev/null; then
            echo "지난 배포에 사진이 없습니다"
          elif git archive FETCH_HEAD img | tar -x -C 콘텐츠; then
            echo "지난 사진 $(ls 콘텐츠/img | wc -l)장을 가져왔습니다"
          else
            echo "사진을 풀지 못했습니다 — 모두 새로 받습니다"
          fi

      - name: 수집 (뉴스만)
        # 날씨·버스는 여기서 받지 않습니다.
        # 공공데이터포털은 해외에서 응답하지 않아 3분을 기다려도 실패했습니다.
        # 그쪽은 화면이 Cloudflare 중계소(서울에서 실행)에서 직접 받아옵니다.
        env:
          PYTHONUTF8: "1"
          NEWS_ONLY: "1"
        run: python 수집기.py

      - name: gh-pages 갈래에 올리기
        env:
          TOKEN: ${{ github.token }}
        run: |
          # 화면에 필요한 것만 담습니다.
          cd 콘텐츠
          rm -rf .git
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="signage-bot" \
              -c user.email="signage-bot@users.noreply.github.com" \
              commit -q -m "데이터 갱신 $(date '+%Y-%m-%d %H:%M')"
          # 갈래를 통째로 덮어써서 예전 기록이 쌓이지 않게 합니다.
          # (10분마다 사진까지 쌓이면 저장소가 하루에 수백 MB씩 불어납니다)
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "올렸습니다"
