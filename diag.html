<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>성능 진단</title>
<!--
  사이니지에서 무엇이 느린지 직접 재는 페이지.
  화면에 결과가 크게 뜨므로 사진으로 찍어 보내주시면 됩니다.

  재는 것
    · 화면 해상도와 확대 배율 (4K 화면에 2배로 그려지고 있는지)
    · 세 가지 애니메이션 방식의 실제 프레임 수
        A 높이(height) — 지금 쓰는 방식
        B 위치(transform) — GPU 방식
        C 높이 + 사진 — 실제 화면과 같은 조건
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  display:flex;flex-direction:column;padding:40px;gap:24px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
h1{font-size:52px;font-weight:900;letter-spacing:-2px;border-bottom:8px solid #fff;padding-bottom:16px}
.env{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;font-size:34px;line-height:1.35}
.env b{color:#4ecf9b;font-weight:700}
.warn{background:#e5484d;color:#fff;font-size:30px;font-weight:900;padding:16px 20px;line-height:1.4}
.res{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.card{border:6px solid #333;padding:18px 22px}
.card.run{border-color:#e8b04b}
.card.done{border-color:#4ecf9b}
.card .t{font-size:32px;font-weight:900;margin-bottom:8px}
.card .v{font-size:46px;font-weight:900;letter-spacing:-1px}
.card .v small{font-size:26px;font-weight:400;color:#9aa7b4;margin-left:12px}
.verdict{margin-top:auto;background:#fff;color:#000;padding:22px;font-size:34px;font-weight:900;line-height:1.35}

/* 측정용 무대 */
#lab{position:fixed;left:-9999px;top:0;width:1008px;height:800px;overflow:hidden;background:#111}
#labRow{position:absolute;left:0;right:0;top:0;height:194px;background:#222;overflow:hidden}
#labRow img{position:absolute;top:0;left:0;width:100%;height:700px;object-fit:cover}
</style>
</head>
<body>
  <h1>사이니지 성능 진단</h1>

  <div class="env mono" id="env"></div>
  <div id="warn"></div>

  <div class="res" id="res"></div>
  <div class="verdict" id="verdict">측정 중… 20초쯤 걸립니다</div>

  <div id="lab"><div id="labRow"><img id="labImg" alt=""></div></div>

<script src="데이터.js" onerror="void 0"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);

/* ── 1. 환경 ── */
const W = innerWidth, H = innerHeight, DPR = devicePixelRatio || 1;
const scale = Math.min(W / 1080, H / 1920);
const realPx = Math.round(1080 * scale * DPR) + " × " + Math.round(1920 * scale * DPR);

$("env").innerHTML = `
  <span>화면 크기</span><b>${W} × ${H}</b>
  <span>픽셀 배율</span><b>${DPR}</b>
  <span>확대 배율</span><b>${scale.toFixed(2)} 배</b>
  <span>실제 그리는 픽셀</span><b>${realPx}</b>`;

if (scale * DPR > 1.3) {
  $("warn").innerHTML = `<div class="warn">화면이 ${(scale*DPR).toFixed(1)}배로 확대되어 그려집니다.
    픽셀 수가 ${((scale*DPR)**2).toFixed(1)}배라 이것만으로도 무거워집니다.</div>`;
}

/* ── 2. 측정 도구 ── */
const row = $("labRow"), img = $("labImg");
// 실제 기사 이미지 한 장을 씁니다 (없으면 빈 상태로 측정)
try {
  const d = window.SIGNAGE_DATA;
  const first = d && d.press && d.press[0] && d.press[0].items[0];
  if (first && first.image) img.src = first.image;
} catch (e) {}

function bench(label, setup, play, done) {
  const card = document.createElement("div");
  card.className = "card run";
  card.innerHTML = `<div class="t">${label}</div><div class="v">측정 중…</div>`;
  $("res").appendChild(card);

  setup();
  const frames = [];
  let last = performance.now(), n = 0;

  requestAnimationFrame(function loop(t) {
    frames.push(t - last); last = t; n++;
    if (n < 55) requestAnimationFrame(loop);
    else {
      const f = frames.slice(3).filter(x => x < 500);
      const avg = f.reduce((a, b) => a + b, 0) / f.length;
      const fps = 1000 / avg;
      const slow = f.filter(x => x > 33).length;
      card.className = "card done";
      card.innerHTML = `<div class="t">${label}</div>
        <div class="v">${fps.toFixed(0)} fps
          <small>느린 프레임 ${slow}개 · 평균 ${avg.toFixed(0)}ms</small></div>`;
      done(fps);
    }
  });
  play();
}

/* ── 3. 세 가지 방식 비교 ── */
const scores = {};
const tests = [
  ["A. 높이 바꾸기 (지금 방식)", () => {
      img.style.display = "none";
      row.style.transition = "none"; row.style.height = "194px"; row.offsetHeight;
      row.style.transition = "height .75s cubic-bezier(.85,0,.15,1)";
    }, () => { row.style.height = "800px"; }],

  ["B. 위치 옮기기 (GPU 방식)", () => {
      img.style.display = "none";
      row.style.transition = "none"; row.style.height = "800px";
      row.style.transform = "translateY(0)"; row.offsetHeight;
      row.style.transition = "transform .75s cubic-bezier(.85,0,.15,1)";
    }, () => { row.style.transform = "translateY(600px)"; }],

  ["C. 높이 + 사진 (실제 조건)", () => {
      img.style.display = "block";
      row.style.transform = "none";
      row.style.transition = "none"; row.style.height = "194px"; row.offsetHeight;
      row.style.transition = "height .75s cubic-bezier(.85,0,.15,1)";
    }, () => { row.style.height = "800px"; }],
];

let i = 0;
(function next() {
  if (i >= tests.length) return benchDecode((single, per) => { scores.D = single; scores.PER = per; verdict(); });
  const [label, setup, play] = tests[i];
  bench(label, setup, play, fps => { scores[["A","B","C"][i]] = fps; i++; setTimeout(next, 900); });
})();

/* ── 3-2. 사진 푸는 시간 ──
   렌더링이 빨라도 사진을 푸는(디코딩) 비용이 크면
   펼치는 순간 사진만 늦게 나타납니다. 그 시간을 직접 잽니다. */
function benchDecode(done) {
  const card = document.createElement("div");
  card.className = "card run";
  card.innerHTML = `<div class="t">D. 사진 푸는 시간</div><div class="v">측정 중…</div>`;
  $("res").appendChild(card);

  const d = window.SIGNAGE_DATA;
  const urls = [];
  try {
    (d.press || []).forEach(p => (p.items || []).forEach(n => { if (n.image) urls.push(n.image); }));
  } catch (e) {}

  if (!urls.length) {
    card.className = "card done";
    card.innerHTML = `<div class="t">D. 사진 푸는 시간</div><div class="v">사진 없음</div>`;
    return done(0, 0);
  }

  // ① 한 장을 캐시 없이 새로 받아 푸는 시간
  const t0 = performance.now();
  const one = new Image();
  one.src = urls[0] + "?nocache=" + Math.random();
  const p1 = one.decode ? one.decode().catch(() => {}) : Promise.resolve();

  p1.then(() => {
    const single = Math.round(performance.now() - t0);

    // ② 전체를 순서대로 푸는 시간
    const t1 = performance.now();
    let i = 0;
    (function next() {
      if (i >= urls.length) {
        const all = Math.round(performance.now() - t1);
        card.className = "card done";
        card.innerHTML = `<div class="t">D. 사진 푸는 시간</div>
          <div class="v">한 장 ${single}ms
            <small>전체 ${urls.length}장 ${all}ms · 장당 평균 ${Math.round(all / urls.length)}ms</small></div>`;
        return done(single, all / urls.length);
      }
      const im = new Image();
      im.src = urls[i++];
      (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(next);
    })();
  });
}

/* ── 4. 판정 ── */
function verdict() {
  const { A, B, C, D, PER } = scores;
  const heavy = scale * DPR > 1.3;
  let msg;

  if (heavy && C < 40) {
    msg = `화면 확대(${(scale*DPR).toFixed(1)}배)가 주된 원인입니다. 해상도를 낮춰 그리는 방식으로 바꿔야 합니다.`;
  } else if (B > A * 1.5) {
    msg = `높이를 바꾸는 방식이 느립니다(${A.toFixed(0)} → ${B.toFixed(0)}fps). 위치 옮기기 방식으로 구조를 바꾸면 개선됩니다.`;
  } else if (A - C > 12) {
    msg = `사진을 그리는 비용이 큽니다(${A.toFixed(0)} → ${C.toFixed(0)}fps). 이미지 해상도를 낮춰야 합니다.`;
  } else if (PER > 60) {
    msg = `사진 한 장 푸는 데 평균 ${Math.round(PER)}ms 걸립니다. 이게 지연의 원인입니다. 사진 크기를 줄여야 합니다.`;
  } else if (C > 45) {
    msg = `렌더링 ${C.toFixed(0)}fps, 사진 푸는 시간 장당 ${Math.round(PER)}ms — 둘 다 문제없습니다. 다른 원인을 봐야 합니다.`;
  } else {
    msg = `전반적으로 느립니다(${C.toFixed(0)}fps). 전환 시간을 줄이고 이미지를 더 작게 만드는 편이 좋습니다.`;
  }
  $("verdict").textContent = msg;
}
</script>
</body>
</html>
